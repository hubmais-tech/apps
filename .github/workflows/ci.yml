# Integração contínua: tipos, testes da API e build das duas imagens Docker.
# Não publica imagem nem faz deploy: a hospedagem ainda não foi escolhida (N1). Ver docs/DEPLOY.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hubmais
          POSTGRES_PASSWORD: hubmais
          POSTGRES_DB: hubmais
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hubmais -d hubmais"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hubmais:hubmais@localhost:5432/hubmais
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: segredo-de-teste-com-mais-de-trinta-e-dois-caracteres
      CLOUDFLARE_ENDPOINT: https://exemplo.r2.cloudflarestorage.com
      CLOUDFLARE_ACCESS_KEY_ID: teste
      CLOUDFLARE_SECRET_ACCESS_KEY: teste
      CLOUDFLARE_BUCKET_NAME: teste
      CLOUDFLARE_PUBLIC_URL: https://media.exemplo.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: api/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate
      # O vitest força PAYMENT_GATEWAY=fake e as taxas, então nada fala com o Stripe.
      - run: node node_modules/vitest/vitest.mjs run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
